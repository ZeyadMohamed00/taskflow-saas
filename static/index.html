<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TaskFlow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#222}
input,button,select{padding:.5rem;margin:.2rem}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.col{background:#f4f4f6;border-radius:8px;padding:.7rem;min-height:120px}
.card{background:#fff;border-radius:6px;padding:.5rem;margin:.4rem 0;box-shadow:0 1px 2px #0002}
.hidden{display:none}.err{color:#b00}
</style></head><body>
<h1>TaskFlow</h1>
<div id="auth"><input id="email" placeholder="email"><input id="pw" type="password" placeholder="password (8+)">
<button onclick="auth('login')">Log in</button><button onclick="auth('register')">Register</button><span id="err" class="err"></span></div>
<div id="app" class="hidden">
<div><select id="ws" onchange="loadProjects()"></select><button onclick="newWs()">+ workspace</button>
<select id="pj" onchange="loadTasks()"></select><button onclick="newPj()">+ project</button>
<button onclick="logout()">Log out</button></div>
<p id="sum"></p>
<div><input id="title" placeholder="new task"><button onclick="newTask()">Add</button></div>
<div class="cols"><div class="col"><h3>To do</h3><div id="todo"></div></div>
<div class="col"><h3>Doing</h3><div id="doing"></div></div>
<div class="col"><h3>Done</h3><div id="done"></div></div></div></div>
<script>
let token=localStorage.getItem("tf_token");
const $=id=>document.getElementById(id);
async function api(path,method="GET",body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&token){logout();return null}
  if(!r.ok){throw new Error((await r.json()).detail||r.statusText)}
  return r.status===204?null:r.json();
}
async function auth(kind){
  try{const t=await api("/auth/"+kind,"POST",{email:$("email").value,password:$("pw").value});
  token=t.access_token;localStorage.setItem("tf_token",token);start()}catch(e){$("err").textContent=" "+e.message}
}
function logout(){token=null;localStorage.removeItem("tf_token");$("app").classList.add("hidden");$("auth").classList.remove("hidden")}
async function start(){if(!token)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");await loadWs()}
async function loadWs(){const w=await api("/workspaces");$("ws").innerHTML=w.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.role})</option>`).join("");await loadProjects()}
async function loadProjects(){if(!$("ws").value){$("pj").innerHTML="";return}const p=await api(`/workspaces/${$("ws").value}/projects`);$("pj").innerHTML=p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");await loadTasks()}
async function loadTasks(){
  for(const c of["todo","doing","done"])$(c).innerHTML="";$("sum").textContent="";
  if(!$("pj").value)return;
  const t=await api(`/projects/${$("pj").value}/tasks`);
  for(const x of t){const d=document.createElement("div");d.className="card";
    d.innerHTML=`${esc(x.title)}<br>`+["todo","doing","done"].filter(s=>s!==x.status).map(s=>`<button data-s="${s}">→ ${s}</button>`).join("")+`<button data-del="1">🗑</button>`;
    d.onclick=async e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.del)await api("/tasks/"+x.id,"DELETE");else await api("/tasks/"+x.id,"PATCH",{status:b.dataset.s});loadTasks()};
    $(x.status).appendChild(d)}
  const s=await api(`/projects/${$("pj").value}/summary`);$("sum").textContent=`${s.done}/${s.total} done (${s.percent_done}%)`;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function newWs(){const n=prompt("Workspace name");if(n){await api("/workspaces","POST",{name:n});loadWs()}}
async function newPj(){const n=prompt("Project name");if(n){await api(`/workspaces/${$("ws").value}/projects`,"POST",{name:n});loadProjects()}}
async function newTask(){if($("title").value){await api(`/projects/${$("pj").value}/tasks`,"POST",{title:$("title").value});$("title").value="";loadTasks()}}
start();
</script></body></html>
